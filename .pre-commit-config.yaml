repos:
  - repo: local
    hooks:
      - id: llmcpp-style-contract
        name: llmcpp style contract
        entry: python3 scripts/check_style.py
        language: system
        pass_filenames: false
        files: ^(include/|src/|tests/test_integration_.*\.cpp$)
      - id: clang-format
        name: clang-format
        entry: clang-format --dry-run --Werror
        language: system
        types_or: [c++, c]
        files: ^(include/|src/|tests/test_integration_.*\.cpp$)
      - id: clang-tidy-naming
        name: clang-tidy naming
        entry: scripts/check_clang_tidy.sh
        language: system
        pass_filenames: false
        files: ^(include/|src/|tests/test_integration_.*\.cpp$)
